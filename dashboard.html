<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Sign Language Reader</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            padding: 10px 25px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 8px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
        }

        .chart-card h3 {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        canvas {
            max-height: 300px;
        }

        .activity-list {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .activity-item {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .activity-type {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .activity-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-camera { background: #4CAF50; }
        .badge-text { background: #2196F3; }
        .badge-quiz { background: #ff9800; }

        .refresh-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Analytics Dashboard</h1>
            <a href="welcome.html" class="back-btn">← Back to Home</a>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalGestures">0</div>
                <div class="stat-label">Total Gestures</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayGestures">0</div>
                <div class="stat-label">Today's Gestures</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgConfidence">0%</div>
                <div class="stat-label">Avg Confidence</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="mostUsed">-</div>
                <div class="stat-label">Most Used Gesture</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="cameraCount">0</div>
                <div class="stat-label">Camera Detections</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="textCount">0</div>
                <div class="stat-label">Text Conversions</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 Daily Activity (Last 7 Days)</h3>
                <canvas id="dailyChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>🏆 Top 5 Gestures</h3>
                <canvas id="topGesturesChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>⏰ Activity by Hour</h3>
                <canvas id="hourlyChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>📊 Camera vs Text</h3>
                <canvas id="modeChart"></canvas>
            </div>
        </div>

        <div class="activity-list">
            <h3>🔄 Recent Activity</h3>
            <button class="refresh-btn" id="refreshActivity">🔄 Refresh</button>
            <div id="activityList">Loading...</div>
        </div>
    </div>

    <script>
        let dailyChart, topGesturesChart, hourlyChart, modeChart;

        async function loadOverview() {
            try {
                const res = await fetch('http://localhost:5000/analytics/overview');
                const data = await res.json();
                if (data.success) {
                    document.getElementById('totalGestures').textContent = data.total_gestures;
                    document.getElementById('todayGestures').textContent = data.today_gestures;
                    document.getElementById('avgConfidence').textContent = data.avg_confidence + '%';
                    document.getElementById('mostUsed').textContent = data.most_used_gesture.substring(0, 15);
                    document.getElementById('cameraCount').textContent = data.camera_count;
                    document.getElementById('textCount').textContent = data.text_count;
                }
            } catch(e) { console.error(e); }
        }

        async function loadChartData() {
            try {
                const res = await fetch('http://localhost:5000/analytics/chart-data');
                const data = await res.json();
                if (data.success) {
                    // Daily Chart
                    if (dailyChart) dailyChart.destroy();
                    dailyChart = new Chart(document.getElementById('dailyChart'), {
                        type: 'line',
                        data: {
                            labels: data.dates,
                            datasets: [{
                                label: 'Gestures',
                                data: data.daily_counts,
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102,126,234,0.1)',
                                fill: true
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: true }
                    });

                    // Top Gestures Chart
                    if (topGesturesChart) topGesturesChart.destroy();
                    topGesturesChart = new Chart(document.getElementById('topGesturesChart'), {
                        type: 'bar',
                        data: {
                            labels: data.top_gesture_names,
                            datasets: [{
                                label: 'Count',
                                data: data.top_gesture_counts,
                                backgroundColor: '#764ba2'
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: true }
                    });

                    // Hourly Chart
                    if (hourlyChart) hourlyChart.destroy();
                    hourlyChart = new Chart(document.getElementById('hourlyChart'), {
                        type: 'line',
                        data: {
                            labels: data.hours,
                            datasets: [{
                                label: 'Activity',
                                data: data.hourly_counts,
                                borderColor: '#4CAF50',
                                fill: false
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: true }
                    });

                    // Mode Chart (Camera vs Text)
                    const cameraCount = parseInt(document.getElementById('cameraCount').textContent);
                    const textCount = parseInt(document.getElementById('textCount').textContent);
                    
                    if (modeChart) modeChart.destroy();
                    modeChart = new Chart(document.getElementById('modeChart'), {
                        type: 'doughnut',
                        data: {
                            labels: ['Camera Mode', 'Text Mode'],
                            datasets: [{
                                data: [cameraCount, textCount],
                                backgroundColor: ['#667eea', '#764ba2']
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: true }
                    });
                }
            } catch(e) { console.error(e); }
        }

        async function loadActivity() {
            try {
                const res = await fetch('http://localhost:5000/analytics/activity-log?limit=20');
                const data = await res.json();
                if (data.success && data.activities) {
                    const activityHtml = data.activities.map(a => {
                        let badgeClass = '';
                        if (a.type === 'camera_detection') badgeClass = 'badge-camera';
                        else if (a.type === 'text_conversion') badgeClass = 'badge-text';
                        else badgeClass = 'badge-quiz';
                        
                        let icon = a.type === 'camera_detection' ? '📹' : (a.type === 'text_conversion' ? '⌨️' : '🎮');
                        
                        return `
                            <div class="activity-item">
                                <div class="activity-type">
                                    <span>${icon}</span>
                                    <span class="activity-badge ${badgeClass}">${a.type}</span>
                                    <span>${a.gesture || a.details || '-'}</span>
                                </div>
                                <span style="font-size: 0.7rem; color: #888;">${new Date(a.time).toLocaleTimeString()}</span>
                            </div>
                        `;
                    }).join('');
                    document.getElementById('activityList').innerHTML = activityHtml || 'No activity yet';
                }
            } catch(e) { console.error(e); }
        }

        document.getElementById('refreshActivity').onclick = () => {
            loadActivity();
            loadOverview();
            loadChartData();
        };

        loadOverview();
        loadChartData();
        loadActivity();
        setInterval(() => { loadOverview(); loadChartData(); }, 30000);
    </script>
</body>
</html>
